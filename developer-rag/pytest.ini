[pytest]
# Only the Week 12 suite is collected by default. The legacy root-level test_*.py scripts need a
# live index and API key (they import config, which raises without GROK_API_KEY) and are NOT
# pytest tests; the Week 11 regression is a stdlib script run directly.
testpaths = tests
markers =
    integration: needs the real race_docs index (data/chroma) and local embedding models; skipped when absent
addopts = -ra
